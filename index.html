<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosmetic Price Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6f8;--ink:#2b1630;--muted:#7a6a80;--berry:#a3175b;--line:#e8dce3;--good:#1b7f5c}
@media(prefers-color-scheme:dark){:root{--bg:#1d1223;--ink:#f5e9f0;--muted:#b3a1bb;--berry:#ff7ab3;--line:#3a2845;--good:#5fd3a5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:56px 20px 80px}
h1{font:800 clamp(2rem,6vw,3.4rem)/1.05 "Bricolage Grotesque",sans-serif;margin:0 0 12px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 28px;max-width:52ch}
form{display:flex;gap:8px;margin-bottom:36px}
input{flex:1;min-width:0;padding:14px 16px;font:inherit;color:inherit;background:transparent;border:2px solid var(--ink);border-radius:10px}
button{padding:14px 22px;font:600 1rem "Instrument Sans",sans-serif;color:#fff;background:var(--berry);border:0;border-radius:10px;cursor:pointer}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.product{padding:22px 0;border-top:1px solid var(--line)}
h2{font:600 1.15rem/1.3 "Bricolage Grotesque",sans-serif;margin:0 0 4px}
.save{display:block;color:var(--good);font-weight:600;font-size:.9rem;margin-bottom:10px}
ul{list-style:none;margin:10px 0 0;padding:0}
li{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:baseline;padding:8px 0}
li.best .price{color:var(--good);font-weight:800}
li.best .store::after{content:" · lowest";color:var(--good);font-weight:600}
.price{font:600 1.1rem "Bricolage Grotesque",sans-serif}
a{color:var(--berry)}
.note{color:var(--muted)}
@media(max-width:480px){li{grid-template-columns:1fr auto}li a{grid-column:1/-1}}
</style>
</head>
<body>
<main>
  <h1>Same shade. Different price.</h1>
  <p class="sub">Search a cosmetic product and see what each store charges, cheapest first.</p>
  <form id="form">
    <input id="q" type="search" placeholder="Try “Maybelline Fit Me” or “niacinamide”" aria-label="Product name" required minlength="2">
    <button>Compare prices</button>
  </form>
  <div id="results" aria-live="polite"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe = u => /^https?:\/\//.test(u) ? u : '#';
const inr = n => '₹' + n.toLocaleString('en-IN');

function product(p) {
  const o = p.offers, low = o[0].price, high = o[o.length - 1].price;
  const save = o.length > 1 && high > low
    ? `<span class="save">Save ${inr(high - low)} at ${esc(o[0].store)}</span>` : '';
  const rows = o.map((x, i) => `<li${i === 0 ? ' class="best"' : ''}>
    <span class="store">${esc(x.store)}</span><span class="price">${inr(x.price)}</span>
    <a href="${esc(safe(x.url))}" target="_blank" rel="noopener">View on ${esc(x.store)}</a></li>`).join('');
  return `<article class="product"><h2>${esc(p.name)}</h2>${save}<ul>${rows}</ul></article>`;
}

async function search(q) {
  const out = $('#results');
  out.innerHTML = '<p class="note">Checking stores. This can take 10 to 20 seconds…</p>';
  try {
    const r = await fetch('/api/search?q=' + encodeURIComponent(q));
    if (!r.ok) throw new Error();
    const { products } = await r.json();
    out.innerHTML = products.length ? products.map(product).join('')
      : '<p class="note">No matches. Try a brand and product name, like “Lakme lipstick”.</p>';
  } catch {
    out.innerHTML = '<p class="note">Couldn’t reach the server. Make sure it is running, then search again.</p>';
  }
}

$('#form').addEventListener('submit', e => { e.preventDefault(); search($('#q').value.trim()); });
</script>
</body>
</html>
